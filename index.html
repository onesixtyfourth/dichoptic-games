<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Dichoptic Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="controls">
  <button data-action="left" aria-label="Move left">&#9664;</button>
  <button data-action="rotate" aria-label="Rotate">&#10227;</button>
  <button data-action="right" aria-label="Move right">&#9654;</button>
  <button data-action="down" aria-label="Soft drop">&#9660;</button>
  <button data-action="drop" aria-label="Hard drop">&#10515;</button>
  <button data-action="pause" aria-label="Pause">&#10074;&#10074;</button>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>Dichoptic Games</h1>
    <h2>Blocks</h2>
    <p id="menu-status"></p>
    <button id="btn-play" class="primary">Play</button>
    <button id="btn-settings">Settings</button>
    <button id="btn-check">Check glasses</button>
    <p class="disclaimer">Use only as directed by your orthoptist or eye-care professional. This app is not a medical device.</p>
  </div>
</div>

<div id="settings" class="overlay hidden">
  <form class="panel" id="settings-form">
    <h2>Settings</h2>
    <label>Viewing mode
      <select name="mode">
        <option value="anaglyph">Coloured glasses</option>
        <option value="split">Split screen (VR viewer)</option>
      </select>
    </label>
    <label data-mode="anaglyph">Glasses colours
      <select name="glasses">
        <option value="red-blue">Red / blue</option>
        <option value="red-cyan">Red / cyan</option>
        <option value="red-green">Red / green</option>
      </select>
    </label>
    <label data-mode="anaglyph">Red lens is over the
      <select name="redLens">
        <option value="left">Left eye</option>
        <option value="right">Right eye</option>
      </select>
    </label>
    <label>Amblyopic (weaker) eye
      <select name="amblyopicEye">
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </label>
    <label>Fellow (stronger) eye contrast: <output id="contrast-out"></output>
      <input type="range" name="fellowContrast" min="0.05" max="1" step="0.05">
      <span class="hint">Lower it until you can see the falling piece and the stack at the same time. Raise it as your vision improves.</span>
    </label>
    <label>Session length (minutes)
      <input type="number" name="sessionMinutes" min="1" max="120" step="1">
    </label>
    <label>Starting level
      <input type="number" name="startLevel" min="1" max="15" step="1">
    </label>
    <button type="submit" class="primary">Save</button>
  </form>
</div>

<div id="check" class="overlay hidden">
  <canvas id="check-canvas"></canvas>
  <p id="check-text"></p>
  <button id="btn-check-done" class="primary">Done</button>
</div>

<script src="app.js"></script>
</body>
</html>
