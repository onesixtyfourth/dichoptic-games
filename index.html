<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Dichoptic Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="safe-probe"></div>
<canvas id="game"></canvas>
<div id="controls"></div>

<div id="home" class="overlay">
  <div class="panel wide">
    <h1>Dichoptic Games</h1>
    <div class="row">
      <button id="btn-settings">Settings</button>
      <button id="btn-check">Check glasses</button>
    </div>
    <div id="game-list"></div>
    <p class="disclaimer">Use only as directed by your orthoptist or eye-care professional. This app is not a medical device.</p>
  </div>
</div>

<div id="menu" class="overlay hidden">
  <div class="panel">
    <h2 id="menu-title"></h2>
    <p id="menu-help" class="hint"></p>
    <p id="menu-status"></p>
    <p id="menu-best" class="hint"></p>
    <button id="btn-play" class="primary">Play</button>
    <button id="btn-restart" class="hidden">Restart</button>
    <button id="btn-menu-settings">Settings</button>
    <button id="btn-back">All games</button>
  </div>
</div>

<div id="settings" class="overlay hidden">
  <form class="panel" id="settings-form">
    <h2>Settings</h2>
    <label>Viewing mode
      <select name="mode">
        <option value="anaglyph">Coloured glasses</option>
        <option value="split">Split screen (VR viewer)</option>
      </select>
    </label>
    <label data-mode="anaglyph">Glasses colours
      <select name="glasses">
        <option value="red-blue">Red / blue</option>
        <option value="red-cyan">Red / cyan</option>
        <option value="red-green">Red / green</option>
      </select>
    </label>
    <label data-mode="anaglyph">Red lens is over the
      <select name="redLens">
        <option value="left">Left eye</option>
        <option value="right">Right eye</option>
      </select>
    </label>
    <label>Amblyopic (weaker) eye
      <select name="amblyopicEye">
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </label>
    <label>Fellow (stronger) eye contrast: <output id="contrast-out"></output>
      <input type="range" name="fellowContrast" min="0.05" max="1" step="0.05">
      <span class="hint">Lower it until you can see what both eyes are shown at the same time. Raise it as your vision improves.</span>
    </label>
    <label>Difficulty
      <select name="difficulty">
        <option value="0">Easy</option>
        <option value="1">Normal</option>
        <option value="2">Hard</option>
      </select>
    </label>
    <label>Session length (minutes)
      <input type="number" name="sessionMinutes" min="1" max="120" step="1">
    </label>
    <button type="submit" class="primary">Save</button>
  </form>
</div>

<div id="check" class="overlay hidden">
  <canvas id="check-canvas"></canvas>
  <p id="check-text"></p>
  <button id="btn-check-done" class="primary">Done</button>
</div>

<script src="js/core.js"></script>
<script src="js/games/arcade.js"></script>
<script src="js/games/puzzles.js"></script>
<script src="js/games/strategy.js"></script>
<script src="js/games/words.js"></script>
</body>
</html>
